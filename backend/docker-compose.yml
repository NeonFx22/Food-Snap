version: '3.8'

services:
  django_backend:
    build: .
    container_name: foodsnap_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-prod
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
